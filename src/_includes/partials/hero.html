<section class="hero">
  <div class="container card-container">
    <div class="card bg-gradient">
      <h4>Total savings</h4>
      <p class="large-text">$11,249.00</p>
    </div>

    <div class="card">
      <h4>Active goals</h4>
      <p class="primary-text large-text">7</p>
    </div>
    <div class="card">
      <h4>Goals completed</h4>
      <p class="accent-text large-text">2</p>
    </div>
    <div class="card">
      <h3>Monthly deposits</h3>
      <div class="chart">
        <canvas id="chart"></canvas>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
        <script>
          // Hero Bar Chart
          const ctx = document.getElementById("chart");

          const data = {
            labels: [
              "Apr",
              "May",
              "Jun",
              "Jul",
              "Aug",
              "Sep",
              "Oct",
              "Nov",
              "Dec",
              "Jan",
              "Feb",
              "Mar",
            ],
            datasets: [
              {
                data: [
                  0, 0, 500, 400, 400, 1150, 1149, 1550, 1950, 1025, 1550, 1550,
                ],
                backgroundColor: ["#FF5722"],
                barPercentage: 0.9,
                borderColor: ["rgba(255, 255, 255, 0.30)"],
                borderRadius: 8,
                borderWidth: 1,
                categoryPercentage: 1.0,
                hoverBackgroundColor: ["#FF5722"],
              },
            ],
          };

          const config = {
            type: "bar",
            data: data,
            options: {
              plugins: {
                legend: {
                  display: false,
                },
              },
              scales: {
                y: {
                  beginAtZero: true,
                  display: false,
                },
                x: {
                  ticks: {
                    display: true,
                    color: "#ffffff",
                    font: {
                      family: "Inter",
                      lineHeight: 1.2,
                      size: 11,
                      weight: 600,
                    },
                  },
                  grid: {
                    display: false,
                  },
                },
              },
            },
          };

          new Chart(ctx, config);
        </script>
      </div>
    </div>
  </div>
</section>
